version: '3.8'

services:
    rt1:
        image: retele:latest
        volumes:
            - .:/elocal
        tty: true
        networks:
            - cap2net
        ports:
         - "8080:8080"
    rt2:
        image: retele:latest
        volumes:
            - .:/elocal
        tty: true
        networks:
            - cap2net
networks:
    cap2net:
        ipam:
            driver: default
            config:
                - subnet: 172.9.0.0/16 
                  gateway: 172.9.1.1
